name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit
      - run: python -m pytest backend/tests -q
      # Hash randomisation catches assertions that depend on set iteration order.
      - run: PYTHONHASHSEED=1 python -m pytest backend/tests -q
      - run: python -m pytest backend/tests/test_schema_migrations.py -q
  # onnxruntime's embedded telemetry worker is only observable on macOS wheels, where it
  # aborted test processes at exit. Ubuntu skips the native check, so it runs here: the
  # test identifies the worker thread by symbol in a control process and requires it to
  # be absent once the package switch is set.
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests/test_onnxruntime_telemetry.py -q -rs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layout-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
  postgres-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      # Registration is explicitly open only in this test process; the script's
      # database is a temporary schema, and the product default remains closed.
      - run: AUTH_REGISTRATION_MODE=open python -m scripts.check_postgres
      - run: >-
          python -u -m scripts.check_milestone_storage --out evals/results/postgres-ci
          --checks postgres-migrations postgres-four-workers postgres-stale-lease postgres-sigkill-loop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-conformance-report
          path: evals/results/postgres-ci/
          retention-days: 14
