name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit
      - run: python -m pytest backend/tests -q
      # Hash randomisation catches assertions that depend on set iteration order.
      - run: PYTHONHASHSEED=1 python -m pytest backend/tests -q
      - run: python -m pytest backend/tests/test_schema_migrations.py -q
  # onnxruntime's embedded telemetry worker is only observable on macOS wheels, where it
  # aborted test processes at exit. Ubuntu skips the native check, so it runs here: the
  # test identifies the worker thread by symbol in a control process and requires it to
  # be absent once the package switch is set.
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests/test_onnxruntime_telemetry.py -q -rs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
