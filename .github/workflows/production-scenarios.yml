name: Production workflow scenarios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: python -u -m scripts.check_production_scenarios --all --out evals/results/production-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-scenario-evidence
          path: evals/results/production-ci
